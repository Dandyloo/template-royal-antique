<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Royal Antique Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--froth);
      padding: 40px 20px;
    }
    .not-found-inner { max-width: 560px; }
    .not-found-number {
      font-family: var(--font-primary);
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 900;
      color: var(--burgundy);
      line-height: 1;
      margin-bottom: 8px;
      opacity: 0.15;
    }
    .not-found-title {
      font-family: var(--font-primary);
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      color: var(--dark-brown);
      margin-bottom: 16px;
    }
    .not-found-desc {
      color: var(--grey);
      font-size: 1rem;
      margin-bottom: 40px;
      font-family: var(--font-secondary);
    }
    .not-found-links {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="not-found">
    <div class="not-found-inner">
      <div class="not-found-number">404</div>
      <h1 class="not-found-title">This Room Is Empty</h1>
      <p class="not-found-desc">The page you're looking for has been moved or doesn't exist. Let's get you back to something beautiful.</p>
      <div class="not-found-links">
        <a href="index.html" class="btn btn-primary">Back to Home</a>
        <a href="products.html" class="btn btn-outline">View Collection</a>
      </div>
    </div>
  </div>
</body>
</html>
